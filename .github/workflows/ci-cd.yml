# CI/CD pipeline
#
#   Pull request  ->  test
#   Push to main  ->  test -> build & push Docker images -> update image tags in k8s/ -> ArgoCD deploys
#
# Images go to GitHub Container Registry (ghcr.io). No extra secrets are
# needed: the built-in GITHUB_TOKEN can push images and commit to the repo.

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["k8s/**", "**.md", "docs/**"] # the deploy job edits k8s/, don't loop
  pull_request:
    branches: [main]

permissions:
  contents: write # deploy job commits the new image tag
  packages: write # push images to ghcr.io

jobs:
  # ---------- 1. Test ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go vet & test
        working-directory: backend
        run: |
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------- 2. Build & push images ----------
  build:
    needs: test
    if: github.event_name == 'push' # only on main, not on pull requests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend] # builds both images in parallel
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gocommerce-${{ matrix.app }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ---------- 3. Update k8s manifests (GitOps) ----------
  # We don't touch the cluster from here. We only change the image tag in git.
  # ArgoCD watches the k8s/ folder and deploys the change by itself.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set new image tags
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for app in backend frontend; do
            sed -i -E "s#image: .*/gocommerce-${app}:[^ ]*#image: ghcr.io/${OWNER}/gocommerce-${app}:${GITHUB_SHA}#" "k8s/${app}.yaml"
          done
          grep -n "image:" k8s/backend.yaml k8s/frontend.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "deploy: ${GITHUB_SHA::7} [skip ci]"
          git push
