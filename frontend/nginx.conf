server {
    listen 80;
    root /usr/share/nginx/html;

    # Forward API calls to the Go backend ("backend" is the service name
    # in docker-compose AND in Kubernetes, so this file works for both).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: unknown paths like /admin/products must return index.html.
    location / {
        try_files $uri /index.html;
    }
}
