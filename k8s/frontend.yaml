# React app (served by nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/YOUR_GITHUB_USERNAME/gocommerce-frontend:latest # CI/CD updates this tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
# type: NodePort -> open it from your browser at http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      nodePort: 30080
